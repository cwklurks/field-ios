# `xcodegen generate` writes Field.xcodeproj from this; the project itself isn't committed.
name: Field

options:
  bundleIdPrefix: com.connork
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: H435XM227M
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"

packages:
  FieldKit:
    path: FieldKit

targets:
  Field:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Field
        type: syncedFolder
      # Shown in full in Settings › About; the root file, so it never drifts.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - package: FieldKit
        product: FieldKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connork.fieldbrowser
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        # Only the launch screen's colour, which no build setting can write.
        INFOPLIST_FILE: Field/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Field
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "To open pages on your own network, like a router or a printer."
        INFOPLIST_KEY_NSCameraUsageDescription: "Only when a page you open asks to use the camera."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Only when a page you open asks to use the microphone."
        # The web view's own "Add to Photos" on a long-pressed image; without it iOS ends the app.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Only to save a picture you chose to keep."

  FieldTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FieldTests
        type: syncedFolder
    dependencies:
      - target: Field
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connork.fieldbrowser.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"

  # Smoothness budgets (docs/PLAN.md, "Smooth"), measured against a Release
  # build; kept out of the everyday test run.
  FieldPerfTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FieldPerfTests
        type: syncedFolder
    dependencies:
      - target: Field
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connork.fieldbrowser.perftests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        # XCTestCase's initialisers are nonisolated; tests mark @MainActor themselves.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Field:
    build:
      targets:
        Field: all
        FieldTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FieldTests
        - package: FieldKit/FieldKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FieldPerf:
    build:
      targets:
        Field: all
        FieldPerfTests: [test]
    test:
      config: Release
      targets:
        - FieldPerfTests
